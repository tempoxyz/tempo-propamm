# policy-engine's CI fetches the private propamm-sdk git dependency through cargo: the lint and test workflows, and
# the signer image workflow, which builds the enclave image on main only, in its eif-signing-dev and eif-signing-prd
# environments (whose jobs' subject names the environment instead of the ref). Trust only the canonical policy-engine
# repository and those workflows, with read-only contents access and no stored cross-repository credential.
subject_pattern:
  - repo:tempoxyz@211589300/policy-engine@1435552866:((ref:refs/heads/.+)|pull_request|environment:eif-signing-(dev|prd))
claim_pattern:
  job_workflow_ref: tempoxyz/policy-engine/\.github/workflows/((lint|test)\.yml@refs/(heads/.+|pull/[0-9]+/merge)|image\.yml@refs/heads/main)
permissions:
  contents: read
