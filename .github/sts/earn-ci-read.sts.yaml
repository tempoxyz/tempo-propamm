# Earn's verify workflow, in tempoxyz/contracts (renamed from tempoxyz/earn), rebuilds its committed
# DirectPropAMM fixture from the pinned PropAMM source and checks the fixture still matches. Trust only
# that repository (matched by its ID) and that workflow, with read-only contents access and no stored
# cross-repository credential.
subject_pattern:
  - repo:tempoxyz@211589300/contracts@1429969935:((ref:refs/heads/.+)|pull_request)
claim_pattern:
  job_workflow_ref: tempoxyz/contracts/\.github/workflows/verify\.yml@refs/(heads/.+|pull/[0-9]+/merge)
permissions:
  contents: read
