[workspace]
members = ["sdk/rust"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/tempoxyz/tempo-propamm"

[workspace.dependencies]
alloy = { version = "2.5", default-features = false, features = ["std", "contract", "providers", "rpc-types", "reqwest-rustls-tls", "sol-types"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
